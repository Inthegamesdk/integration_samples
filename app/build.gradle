apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace = "com.syncedapps.inthegametvexample"

    compileSdkVersion = 35

    defaultConfig {
        applicationId "com.syncedapps.inthegametvexample"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 149
        versionName "2.1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }


    kotlinOptions {
        jvmTarget = 17
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }
}

dependencies {
    def kotlin_version = "1.9.24"

    implementation fileTree(dir: "libs", include: ["*.jar"])

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.2'

    //noinspection GradleDependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'

    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-crashlytics'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation("io.datazoom.sdk:media3:1.0.0")


    // ITG
    implementation("io.inthegame.sdk:core:2.7.0.4")
    implementation("io.inthegame.sdk:media3:2.7.0")
    implementation("io.inthegame.sdk:compose:2.7.0")
    implementation("io.inthegame.sdk:datazoom:2.7.0.1")

    implementation(platform("androidx.compose:compose-bom:2026.01.00"))
    androidTestImplementation(platform("androidx.compose:compose-bom:2026.01.00"))

    // Core Compose
    implementation("androidx.activity:activity-compose:1.9.2")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.foundation:foundation")

    implementation("androidx.compose.material3:material3")

    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.ui:ui-tooling")

    implementation("androidx.media3:media3-ui-compose:1.9.0")
    implementation("androidx.media3:media3-ui-compose-material3:1.9.0")

}
